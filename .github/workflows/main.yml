      - name: Optimize Windows Performance for RDP
        run: |
          Write-Host "=== Otimizando Windows para desempenho ==="

          # Plano de energia: Alto desempenho
          powercfg /setactive SCHEME_MIN

          # Desativar efeitos visuais para reduzir overhead
          $visualPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $visualPath -Force | Out-Null
          Set-ItemProperty -Path $visualPath -Name "VisualFXSetting" -Type DWord -Value 2

          # Priorizar desempenho do sistema
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" `
            -Name "Win32PrioritySeparation" `
            -Type DWord `
            -Value 38

          # Reduzir animações do Explorer
          $desktop = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $desktop -Name "MenuShowDelay" -Value "0"
          Set-ItemProperty -Path $desktop -Name "DragFullWindows" -Value "0"

          # Desativar transparência
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $personalize -Force | Out-Null
          Set-ItemProperty -Path $personalize -Name "EnableTransparency" -Type DWord -Value 0

          # Otimizações para RDP
          $rdpPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $rdpPath -Force | Out-Null

          # Desativar papel de parede durante RDP
          Set-ItemProperty -Path $rdpPath -Name "fDisableWallpaper" -Type DWord -Value 1

          # Desativar animações de menu durante RDP
          Set-ItemProperty -Path $rdpPath -Name "fDisableFullWindowDrag" -Type DWord -Value 1

          # Desativar fontes suavizadas durante RDP
          Set-ItemProperty -Path $rdpPath -Name "fDisableFontSmoothing" -Type DWord -Value 1

          # Desativar composição da área de trabalho
          Set-ItemProperty -Path $rdpPath -Name "fDisableDesktopComposition" -Type DWord -Value 1

          # Garantir que o serviço de otimização esteja funcionando
          Set-Service -Name "Schedule" -StartupType Automatic -ErrorAction SilentlyContinue

          Write-Host "=== Otimização concluída ==="

          # Mostrar plano de energia ativo
          powercfg /getactivescheme
